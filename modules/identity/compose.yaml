services:
  identity-service:
    image: distributed-programming-identity:local
    build:
      context: ./modules/identity
      dockerfile: Dockerfile
    environment:
      IDENTITY_MYSQL_ADDRESS: mysql:3306
      IDENTITY_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${IDENTITY_GRPC_PORT:-8081}:8081"
      - "${IDENTITY_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
