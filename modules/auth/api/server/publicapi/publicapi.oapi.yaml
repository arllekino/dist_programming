openapi: 3.0.0
info:
  version: 1.0.0
  title: Auth service public API
  x-api-identifier: authpublicapi
paths:
  /api/public/v1/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/registerRequest"
      responses:
        "201":
          description: >
            Registered. The token is absent when the session could not be
            created; the client should log in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/registration"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "409":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "503":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  /api/public/v1/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/loginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/session"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "503":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  /api/public/v1/logout:
    post:
      operationId: logout
      security:
        - bearer: []
      responses:
        "204":
          description: Logged out
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "503":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  /api/public/v1/password:
    post:
      operationId: changePassword
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/changePasswordRequest"
      responses:
        "204":
          description: Password changed; other sessions are revoked
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        "503":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    profile:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
      required:
        - firstName
        - lastName
        - email
    registerRequest:
      type: object
      properties:
        login:
          type: string
        password:
          type: string
        profile:
          $ref: "#/components/schemas/profile"
      required:
        - login
        - password
        - profile
    registration:
      type: object
      properties:
        userID:
          type: string
        session:
          $ref: "#/components/schemas/session"
      required:
        - userID
    loginRequest:
      type: object
      properties:
        login:
          type: string
        password:
          type: string
      required:
        - login
        - password
    session:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - token
        - expiresAt
    changePasswordRequest:
      type: object
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
      required:
        - oldPassword
        - newPassword
    error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
