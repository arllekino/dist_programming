services:
  auth-service:
    image: distributed-programming-auth:local
    build:
      context: ./modules/auth
      dockerfile: Dockerfile
    environment:
      AUTH_MYSQL_ADDRESS: mysql:3306
      AUTH_AMQP_URL: amqp://local:local@rabbitmq:5672/
      AUTH_SESSION_ADDRESS: session-service:8081
      AUTH_IDENTITY_ADDRESS: identity-service:8081
    ports:
      - "${AUTH_HTTP_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      session-service:
        condition: service_started
      identity-service:
        condition: service_started
