services:
  session-service:
    image: distributed-programming-session:local
    build:
      context: ./modules/session
      dockerfile: Dockerfile
    environment:
      SESSION_REDIS_ADDRESS: redis:6379
      SESSION_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${SESSION_GRPC_PORT:-8081}:8081"
      - "${SESSION_HTTP_PORT:-8082}:8082"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  session-message-handler:
    image: distributed-programming-session:local
    command: [message-handler]
    environment:
      SESSION_REDIS_ADDRESS: redis:6379
      SESSION_AMQP_URL: amqp://local:local@rabbitmq:5672/
    ports:
      - "${SESSION_MESSAGE_HANDLER_PORT:-8083}:8082"
    depends_on:
      session-service:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
