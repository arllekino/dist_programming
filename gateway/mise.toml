[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
protoc = "36.2"
protoc-gen-go = "1.36.12"
protoc-gen-go-grpc = "1.6.2"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "v2.8.0"

[tasks.all]
run = [
 { task = "generate" },
 { task = "modules" },
 { task = "build" },
 { task = "test" },
 { task = "integration-tests" },
 { task = "lint" },
]

[tasks.generate]
run = [ { task = "grpc-generate" }, { task = "oapi-generate" } ]

[tasks.grpc-generate]
run = """
protoc --proto_path=docs/api \
 --go_out=. --go_opt=module=github.com/distributed-programming-2026/gateway \
 --go-grpc_out=. --go-grpc_opt=module=github.com/distributed-programming-2026/gateway \
 docs/api/interceptorgrpc/interceptorgrpc.proto
"""

[tasks.oapi-generate]
run = "oapi-codegen -package interceptorrest -generate types,client,spec -o api/client/interceptorrest/interceptorrest.gen.go docs/api/interceptorrest/interceptorrest.oapi.yaml"

[tasks.modules]
run = "go mod tidy"

[tasks.build]
env = { GOOS = "linux", CGO_ENABLED = "0" }
run = "go build -trimpath -o dist/gateway ./cmd"

[tasks.test]
run = "go test ./cmd ./internal/gateway/..."

[tasks.integration-tests]
run = "go test -race -count=1 ./internal/integration-tests"

[tasks.lint]
run = "golangci-lint run"

[tasks.coverage]
run = [
 "mkdir -p dist",
 "go test -race -count=1 -coverpkg=./internal/gateway/... -coverprofile=dist/coverage.out ./cmd ./internal/gateway/... ./internal/integration-tests",
 "go tool cover -func=dist/coverage.out",
 "go tool cover -html=dist/coverage.out -o dist/coverage.html",
]
